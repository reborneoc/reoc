name: Build REOC ReShade 6.8.0 NoGUI

'on':
  push:
    branches:
      - build/reshade-680-reoc-nogui

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout ReShade 6.8.0
        uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: v6.8.0
          submodules: recursive
          path: reshade

      - name: Disable GUI define
        shell: pwsh
        run: |
          $path = 'reshade/CMakeLists.txt'
          $text = Get-Content -LiteralPath $path -Raw
          $text2 = $text -replace '(?m)^\s*RESHADE_GUI\s*\r?\n',''
          if ($text2 -eq $text) { throw 'RESHADE_GUI define not found' }
          Set-Content -LiteralPath $path -Value $text2 -Encoding UTF8

      - name: Configure x86
        shell: pwsh
        run: cmake -S reshade -B build -G "Visual Studio 17 2022" -A Win32

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --target ReShade -- /m

      - name: Prepare artifact
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Filter 'ReShade32.dll' -Recurse | Select-Object -First 1
          if ($null -eq $dll) { throw 'ReShade32.dll not found' }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination 'artifact/dxgi.dll' -Force
          Copy-Item -LiteralPath 'reshade/LICENSE.md' -Destination 'artifact/ReShade_LICENSE.md' -Force
          'REOC custom ReShade 6.8.0 x86 runtime - GUI disabled at compile time' | Set-Content -LiteralPath 'artifact/README_REOC.txt' -Encoding UTF8
          Get-FileHash 'artifact/dxgi.dll' -Algorithm SHA256 | Format-List | Out-File 'artifact/SHA256.txt'

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: REOC-ReShade-6.8.0-x86-NoGUI
          path: artifact/
          if-no-files-found: error
          retention-days: 3
